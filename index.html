rningBody:'フロントで荷物を受け取れない宿泊施設は、対象エリア内でも当日配送をご利用いただけません。',hotelLabel:'ホテル名（任意・参考用）',hotelHint:'ホテル名は配送対象エリアの判定には使用しません。',addressLabel:'Googleマップの住所（必須）',addressHint:'Googleマップに表示された住所全体をそのまま貼り付けてください。',frontCheck:'宿泊施設に荷物を受け取れるフロントがあることを確認しました。',submit:'⌕ 当日配送の可否を確認',infoTitle:'🚚 ご利用案内',info1:'受付完了締切：11:30',info2:'推奨来店時間：11:10〜11:15',info3:'ホテル到着予定：当日20:00以降',info4:'※ 天候・交通状況により到着時間が変動する場合があります。',footer:'最終的な受付可否は現地スタッフが確認します。',placeholderHotel:'例：神戸メリケンパークオリエンタルホテル',placeholderAddress:'例：5-6 Hatobacho, Chuo Ward, Kobe, Hyogo 650-0042',yes:'当日配送対象エリア',no:'当日配送対象外エリア',review:'スタッフへの確認が必要',yesBody:'当日配送対象エリアです。フロントでの受け取りと受付締切時間をご確認ください。',noBody:'当日配送対象エリアには含まれていません。',reviewBody:'住所から市・区を正確に特定できません。Googleマップの住所全体をご確認いただくか、スタッフにお尋ねください。',frontNo:'荷物を受け取れるフロントがない場合は配送できません。',frontAsk:'先に上のフロント確認チェックボックスにチェックを入れてください。',empty:'Googleマップの住所を入力してください。',matched:'判定エリア'}};

let lang='ko';const $=id=>document.getElementById(id);const norm=s=>s.normalize('NFKC').toLowerCase();
function classify(address){
  const a=norm(address).replace(/\s+/g,' ');
  let city=null;
  for(const [key,c] of Object.entries(areas)){
    if(a.includes(c.jp)||new RegExp('(?:^|[,\\s])(?:'+c.en.join('|')+')(?:[,\\s]|$)','i').test(a)){
      city=key;break;
    }
  }
  if(!city)return {status:'review'};
  const c=areas[city];
  // Japanese addresses commonly have no separators: 大阪府大阪市中央区...
  // Match known ward names as suffixes after the identified city, not the whole city+ward token.
  const cityPos=a.indexOf(c.jp);
  const afterCity=cityPos>=0?a.slice(cityPos+c.jp.length):a;
  for(const ward of Object.values(c.wards)){
    if(afterCity.includes(ward))return {status:'yes',city,ward};
  }
  // Google Maps can also provide English wards such as Chuo Ward or Chuo-ku.
  const english=afterCity.match(/\b([a-z]+(?:[ -][a-z]+)?)\s*(?:-\s*ku|ward)\b/gi)||[];
  for(const item of english){
    const key=item.toLowerCase().replace(/\s*(?:-\s*ku|ward)$/,'').replace(/[^a-z]/g,'');
    if(c.wards[key])return {status:'yes',city,ward:c.wards[key]};
  }
  // A recognizable ward outside the supported list is not eligible.
  const japaneseWard=afterCity.match(/(?:[一-龯ぁ-んァ-ヶ]{1,12}区)/);
  if(japaneseWard)return {status:'no',city,ward:japaneseWard[0]};
  if(english.length)return {status:'no',city,ward:english[0]};
  return {status:'review'};
}
